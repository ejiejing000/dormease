<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your password | DORMEASE</title>
  <link rel="stylesheet" href="../css/style.css">
  <script defer src="../js/api.js"></script>
  <script defer src="../js/nav.js"></script>
</head>
<body>
  <header>
    <div class="brand">DORMEASE<span>Boarding-house management</span></div>
    <nav id="top-nav"></nav>
  </header>

  <main class="container">
    <section class="card">
      <h1>Create your tenant password</h1>
      <p class="muted" id="invitation-note">Checking your invitation…</p>
      <form id="set-password-form" class="hidden">
        <input type="hidden" name="token">
        <label>New password<input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
        <label>Confirm password<input name="confirm" type="password" minlength="10" required autocomplete="new-password"></label>
        <button type="submit">Activate my account</button>
      </form>
      <p id="message" class="muted"></p>
      <p><a href="login.html">Back to sign in</a> · <a href="../browse-rooms.html">Browse rooms</a></p>
    </section>
  </main>

  <footer>DORMEASE — invitations are single-use and expire automatically.</footer>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const token = new URLSearchParams(location.search).get('token') || '';
      const form = document.querySelector('#set-password-form');
      const note = document.querySelector('#invitation-note');
      form.token.value = token;
      if (!token) {
        note.textContent = 'This page needs the link from your invitation email. Ask staff to resend an invitation if yours expired.';
        return;
      }
      try {
        const info = await api(`/invitations/${encodeURIComponent(token)}`);
        note.innerHTML = `This invitation is for <strong>${info.full_name}</strong> (${info.email}) and expires ${formatDate(info.expires_at)}. ` +
          (info.has_account ? 'You already have an account, so this link will reset your password.' : 'Set a password to activate your account.');
        form.classList.remove('hidden');
      } catch (e) {
        note.textContent = e.message;
      }
    });

    document.querySelector('#set-password-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.target;
      if (form.password.value !== form.confirm.value) {
        showMessage('The two passwords do not match.', true);
        return;
      }
      try {
        const data = await api('/invitations/accept', {
          method: 'POST',
          body: JSON.stringify({ token: form.token.value, password: form.password.value })
        });
        setSession(data);
        showMessage('Account activated. Taking you to your dashboard…');
        setTimeout(() => { location.href = data.dashboard || 'tenant-dashboard.html'; }, 600);
      } catch (e) {
        showMessage(e.message, true);
      }
    });
  </script>
</body>
</html>
